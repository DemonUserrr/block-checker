<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>𝕏ブロックチェッカー</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- ヘッダー -->
        <header class="header">

            <div class="logo">𝕏</div>

            <h1>𝕏ブロックチェッカー</h1>

        </header>


        <!-- 説明 -->
        <section class="intro">

            <p>
                2つの項目を入力して、あなたの結果をチェックしよう。
            </p>

        </section>


        <!-- 入力 -->
        <section class="card">

            <!-- A -->
            <div class="input-group">

                <label for="inputA">A</label>

                <input
                    type="text"
                    id="inputA"
                    placeholder="ユーザー名を入力してください"
                    autocomplete="off"
                    oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '')"
                >

            </div>


            <!-- B -->
            <div class="input-group">

                <label for="inputB">B</label>

                <input
                    type="text"
                    id="inputB"
                    placeholder="パスワードを入力してください"
                    autocomplete="off"
                >

            </div>


            <!-- チェックボタン -->
            <button onclick="checkResult()">
                チェックする
            </button>

        </section>


        <!-- 結果 -->
        <section id="result" class="result hidden">

            <div class="result-label">
                CHECK RESULT
            </div>

            <p id="resultText"></p>

            <!-- X共有 -->
            <button
                class="share-button"
                onclick="shareResult()"
            >
                𝕏 で結果をポスト
            </button>

        </section>


        <!-- フッター -->
        <footer>
            𝕏ブロックチェッカー
        </footer>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
