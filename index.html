<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロックチェッカー</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>ブロックチェッカー</h1>
        <p class="description">
            2つの項目を入力してチェックしてみよう。
        </p>

        <div class="card">

            <label>ユーザー名</label>
            <input type="text" id="inputA" placeholder="ここに入力">

            <label>パスワード</label>
            <input type="text" id="inputB" placeholder="ここに入力">

            <button onclick="checkResult()">
                チェックする
            </button>

        </div>

        <div id="result" class="result hidden">
            <h2>チェック結果</h2>
            <p id="resultText"></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
