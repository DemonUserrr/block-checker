<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xブロックチェッカー</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <div class="logo">𝕏</div>
            <h1>Xブロックチェッカー</h1>
        </header>

        <section class="intro">
            <p>
                2つの項目を入力して、あなたの結果をチェックしよう。
            </p>
        </section>

        <section class="card">

            <div class="input-group">
                <label for="inputA">ユーザー名</label>
                <input
                    type="text"
                    id="inputA"
                    placeholder="入力してください"
                >
            </div>

            <div class="input-group">
                <label for="inputB">パスワード</label>
                <input
                    type="text"
                    id="inputB"
                    placeholder="入力してください"
                >
            </div>

            <button onclick="checkResult()">
                チェックする
            </button>

        </section>

        <section id="result" class="result hidden">

            <div class="result-label">
                CHECK RESULT
            </div>

            <p id="resultText"></p>

            <button class="share-button" onclick="shareResult()">
                𝕏 で結果をポスト
            </button>

        </section>

        <footer>
            Xブロックチェッカー
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
